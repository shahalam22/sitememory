[project]
name = "sitememory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shah Alam", email = "shahalamabir21@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sitememory = "sitememory:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E: style errors; F: common programming errors
# I: import sorting; UP: modern Python syntax
# B: common bug patterns

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"